filetype: typescript

detect:
    filename: "\\.tsx?$"

rules:
    # JSX Tag Patterns (Top-level, non-recursive)
    - identifier.class: "<[a-zA-Z0-9_-]+\\.[A-Za-z0-9_.-]*"
    - identifier.class: "</[a-zA-Z0-9_-]+\\.[A-Za-z0-9_.-]*>"
    - identifier.class: "<[A-Z][A-Za-z0-9_.-]*"
    - identifier.class: "</[A-Z][A-Za-z0-9_.-]*>"
    - symbol.tag: "<[a-z][A-Za-z0-9_.-]*"
    - symbol.tag: "</[a-z][A-Za-z0-9_.-]*>"
    - symbol.tag: "/>"
    - preproc: "\\b[a-zA-Z_][a-zA-Z0-9_-]*\\s*=\\s*([\"'{])"
    - preproc: "\\b(class(Name)?|id|style|src|href|type|value|placeholder|name|key|ref|alt|role|width|height|title|target|rel|htmlFor|fill|stroke|strokeWidth|viewBox|d|cx|cy|r|x|y|disabled|checked|selected|readonly|multiple|autofocus|required|pattern|min|max|step|action|method|enctype|novalidate|async|defer|charset|content|httpEquiv|media|sizes|srcSet|crossOrigin|integrity|for|rows|cols|wrap|maxlength|minlength|autocomplete|autocorrect|autocapitalize|spellcheck|draggable|hidden|tabIndex|accessKey|variant|color|size|theme|component|as|open|onClose|loading|active|aria-[a-zA-Z0-9_-]+|data-[a-zA-Z0-9_-]+|on[A-Z][a-zA-Z0-9_-]*)\\s*="
    - default: "\\b(const|let|var|type)\\s+[a-zA-Z_][a-zA-Z0-9_-]*\\s*="

    - constant.number: "\\b[-+]?([1-9][0-9]*|0[0-7]*|0x[0-9a-fA-F]+)([uU][lL]?|[lL][uU]?)?\\b"
    - constant.number: "\\b[-+]?([0-9]+\\.[0-9]*|[0-9]*\\.[0-9]+)([EePp][+-]?[0-9]+)?[fFlL]?"
    - constant.number: "\\b[-+]?([0-9]+[EePp][+-]?[0-9]+)[fFlL]?"
    - identifier: "[A-Za-z_][A-Za-z0-9_]*[[:space:]]*[(]"
    - statement: "\\b(abstract|as|async|await|break|case|catch|class|const|constructor|continue)\\b"
    - statement: "\\b(debugger|declare|default|delete|do|else|enum|export|extends|finally|for|from)\\b"
    - statement: "\\b(function|get|if|implements|import|in|instanceof|interface|is|let|module|namespace)\\b"
    - statement: "\\b(new|of|package|private|protected|public|require|return|set|static|super|switch)\\b"
    - statement: "\\b(this|throw|try|type|typeof|var|void|while|with|yield)\\b"
    - constant: "\\b(false|true|null|undefined|NaN)\\b"
    - type: "\\b(Array|Boolean|Date|Enumerator|Error|Function|Math)\\b"
    - type: "\\b(Number|Object|RegExp|String|Symbol)\\b"
    - type: "\\b(any|unknown|boolean|never|number|string|symbol)\\b"
    - statement: "[-+/*=<>!~%?:&|]"
    - constant: "\\\\[0-7][0-7]?[0-7]?|\\\\x[0-9a-fA-F]+|\\\\[bfnrt'\"\\?\\\\]"
    - comment:
          start: "//"
          end: "$"
          rules: []
    - comment:
          start: "/\\*"
          end: "\\*/"
          rules:
              - todo: "TODO:?"

    - constant.string.regexp:
          start: "(^|[-+/*=>!~%?:&|([{,;]|\\s)/([^\\s\\*/\\\\]|\\\\.)"
          end: "/[gimuy]*|$"
          skip: "\\\\."

    - constant.string:
          start: '"'
          end: '"'
          skip: "\\\\."
          rules:
              - constant.specialChar: "\\\\."
    - constant.string:
          start: "'"
          end: "'"
          skip: "\\\\."
          rules:
              - constant.specialChar: "\\\\."
    - constant.string:
          start: "`"
          end: "`"
          skip: "\\\\."
          rules:
              - constant.specialChar: "\\\\."
              - identifier: "\\x24\\{.*?\\}"
